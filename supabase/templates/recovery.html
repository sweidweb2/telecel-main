<h2>Reset your password</h2>
<p>Someone asked to reset the password for your Telecel Global CMS account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/update-password">
    Choose a new password
  </a>
</p>
<p>This link works once and expires in 1 hour. If you did not ask for it, you can ignore this email.</p>
