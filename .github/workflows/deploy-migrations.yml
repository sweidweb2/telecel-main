# Pushes pending files in supabase/migrations to the linked project on merge to main.
# Does not run seed.sql.
#
# Order: run this (or confirm migrations applied) BEFORE promoting an app
# release that depends on new RPCs/tables (e.g. save_blog). App-first deploys
# break CMS writes until db push succeeds.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN  — Personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    — Project ref from the dashboard URL
#   SUPABASE_DB_PASSWORD   — Database password for that project
name: Deploy Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: deploy-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Supabase secrets not configured - skipping migration deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        if: steps.guard.outputs.enabled == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.2.0

      - name: Link project
        if: steps.guard.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Applies pending files in supabase/migrations only. Never runs seed.sql.
      - name: Push migrations
        if: steps.guard.outputs.enabled == 'true'
        run: supabase db push
