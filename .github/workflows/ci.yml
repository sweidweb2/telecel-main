# Required branch-protection check name: "CI"
#
# Quality gates (every PR / push to main):
#   1. ESLint
#   2. TypeScript (next typegen + tsc --noEmit)
#   3. Vitest unit tests (lib, validations, data, actions — excludes e2e/)
#   4. Next.js production build
#   5. Playwright E2E (public site always; auth/blogs/users/observability when
#      Supabase + E2E seed secrets are configured — otherwise those suites skip)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Prefer repo secrets so auth / blogs / users / observability E2E can run;
      # fall back to placeholders so lint / typecheck / unit / build / public E2E
      # still work without secrets.
      # NEXT_PUBLIC_* are inlined at build time — must be set for the whole job.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_SEED_EMAIL: ${{ secrets.E2E_SEED_EMAIL }}
      E2E_SEED_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Next.js build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
