<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Telecel Global connected world hero illustration</title>
<desc id="desc">A vector illustration of a connected globe above a modern city, with network paths and telecom service cards.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f5f5f3"/><stop offset="1" stop-color="#e9e9e7"/></linearGradient>
  <radialGradient id="globe" cx="35%" cy="25%" r="75%"><stop stop-color="#fff"/><stop offset=".48" stop-color="#d8d9dc"/><stop offset="1" stop-color="#858990"/></radialGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7778"/><stop offset=".5" stop-color="#e51b23"/><stop offset="1" stop-color="#a90e19"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#f3f3f1" stop-opacity=".82"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="globeClip"><circle cx="1080" cy="365" r="215"/></clipPath>
</defs>
<rect width="1600" height="900" fill="transparent"/>
<!-- soft atmosphere -->
<circle cx="1080" cy="365" r="330" fill="#e51b23" opacity=".035"/>
<path d="M0 720 Q260 655 480 720 T930 700 T1600 710 V900 H0Z" fill="#e8e8e6"/>
<path d="M0 775 Q260 720 510 770 T1020 760 T1600 765 V900 H0Z" fill="#d8d9d8" opacity=".55"/>
<!-- distant skyline -->
<g fill="#aeb1b5" opacity=".72">
 <path d="M650 700V615h34v85zm45 0V570h43v130zm57 0V640h27v60zm40 0V525h48v175zm61 0V590h32v110zm45 0V560h54v140zm68 0V625h32v75zm45 0V580h42v120zm58 0V630h28v70zm43 0V550h48v150zm62 0V610h34v90z"/>
 <path d="M792 525l27-58 26 58zM1094 550l23-72 24 72z" />
</g>
<g stroke="#f7f7f6" stroke-width="4" opacity=".7">
 <path d="M707 584v116m17-130v130m90-138v138m18-160v160m110-128v128m17-142v142m132-135v135m17-150v150"/>
</g>
<!-- globe -->
<circle cx="1080" cy="365" r="224" fill="#fff" opacity=".5" filter="url(#shadow)"/>
<circle cx="1080" cy="365" r="215" fill="url(#globe)" stroke="#fff" stroke-width="5"/>
<g clip-path="url(#globeClip)" fill="#8f949b" opacity=".68">
 <path d="M922 244l28-24 34 8 22 28-18 18-6 31-25 17-8 35-27-8-13-32-26-12 10-36z"/>
 <path d="M1030 196l36-18 35 15 19 28-14 25 18 20-14 29-37-4-20-25-35-9-12-30z"/>
 <path d="M1138 250l34-20 42 12 24 31-13 27-35 9-17 34-28-11-8-34-27-16z"/>
 <path d="M1005 342l30-17 32 13 18 30-8 39-24 23-8 50-24 29-19-38-6-48-22-31z"/>
 <path d="M1128 354l30-18 41 16 16 39-17 25-31 10-12 38-25 8-18-34 7-39z"/>
 <path d="M1225 430l30-15 31 17 8 35-26 21-33-14-18-25z"/>
</g>
<!-- globe latitude/longitude -->
<g clip-path="url(#globeClip)" fill="none" stroke="#fff" stroke-width="2" opacity=".52">
 <ellipse cx="1080" cy="365" rx="170" ry="215"/><ellipse cx="1080" cy="365" rx="95" ry="215"/>
 <ellipse cx="1080" cy="365" rx="215" ry="75"/><ellipse cx="1080" cy="365" rx="215" ry="145"/>
 <path d="M865 365h430M1080 150v430"/>
</g>
<!-- network paths -->
<g fill="none" stroke="url(#red)" stroke-width="3" opacity=".85">
 <path d="M830 390Q955 210 1080 365T1375 260"/>
 <path d="M900 520Q1035 320 1210 360T1400 480"/>
 <path d="M910 230Q1080 80 1270 225"/>
 <path d="M820 330Q1010 600 1280 450"/>
</g>
<g fill="#fff" stroke="#e51b23" stroke-width="3" filter="url(#glow)">
 <circle cx="830" cy="390" r="7"/><circle cx="1080" cy="365" r="8"/><circle cx="1375" cy="260" r="7"/>
 <circle cx="900" cy="520" r="6"/><circle cx="1210" cy="360" r="7"/><circle cx="1400" cy="480" r="6"/>
 <circle cx="910" cy="230" r="6"/><circle cx="1270" cy="225" r="6"/>
</g>
<!-- orbital rings -->
<g fill="none" stroke="#e51b23" opacity=".42"><ellipse cx="1080" cy="365" rx="290" ry="125" transform="rotate(-22 1080 365)" stroke-width="2"/><ellipse cx="1080" cy="365" rx="260" ry="160" transform="rotate(26 1080 365)" stroke-width="1.5"/></g>
<!-- telecom tower -->
<g stroke="#e51b23" stroke-width="4" fill="none" opacity=".9">
 <path d="M1370 730l34-210 34 210m-57-140h46m-52 55h58m-64 55h70m-72 30h76m-62-140l43 55m-43 0l43-55"/>
 <path d="M1388 515q16-22 32 0m-42-15q26-38 52 0m-59-14q33-52 66 0" stroke-width="3"/>
</g>
<!-- red light trail -->
<path d="M0 815Q340 770 590 812T1100 790T1600 820" fill="none" stroke="#e51b23" stroke-width="5" opacity=".55" filter="url(#glow)"/>
<!-- floating service cards -->
<g filter="url(#shadow)" font-family="Arial, sans-serif">
 <g transform="translate(690 230) rotate(5)">
  <rect width="190" height="88" rx="18" fill="url(#card)" stroke="#fff" stroke-width="2"/>
  <g transform="translate(25 24)" stroke="#e51b23" stroke-width="3" fill="none"><path d="M16 0L3 37m13-37 13 37M8 25h16M12 13h8M16 0v-7"/><path d="M4 4q12-14 24 0M-2-3q18-22 36 0" /></g>
  <text x="72" y="38" font-size="16" fill="#171717" font-weight="600">Wholesale</text><text x="72" y="58" font-size="16" fill="#171717">Connectivity</text>
 </g>
 <g transform="translate(1280 170) rotate(-6)">
  <rect width="175" height="82" rx="18" fill="url(#card)" stroke="#fff" stroke-width="2"/>
  <path d="M25 49q-13-2-13-14 0-12 14-13 7-17 25-7 11 6 8 18 13 3 9 14-2 7-11 7H26" fill="none" stroke="#e51b23" stroke-width="3"/>
  <text x="83" y="48" font-size="17" fill="#171717" font-weight="600">Cloud</text>
 </g>
 <g transform="translate(1325 325) rotate(-3)">
  <rect width="170" height="82" rx="18" fill="url(#card)" stroke="#fff" stroke-width="2"/>
  <g transform="translate(25 22)" stroke="#e51b23" stroke-width="3" fill="none"><circle cx="22" cy="18" r="5"/><circle cx="4" cy="2" r="4"/><circle cx="41" cy="2" r="4"/><circle cx="4" cy="36" r="4"/><circle cx="41" cy="36" r="4"/><path d="M8 5l10 10m8 0L38 5M8 33l10-10m8 0 12 10"/></g>
  <text x="82" y="49" font-size="17" fill="#171717" font-weight="600">IoT</text>
 </g>
 <g transform="translate(1320 485) rotate(3)">
  <rect width="210" height="86" rx="18" fill="url(#card)" stroke="#fff" stroke-width="2"/>
  <path d="M35 18l20 7v17q-2 16-20 25Q17 58 15 42V25z" fill="none" stroke="#e51b23" stroke-width="3"/><path d="M25 42l7 7 14-16" fill="none" stroke="#e51b23" stroke-width="3"/>
  <text x="76" y="50" font-size="16" fill="#171717" font-weight="600">Cybersecurity</text>
 </g>
 <g transform="translate(740 410) rotate(-4)">
  <rect width="160" height="78" rx="18" fill="url(#card)" stroke="#fff" stroke-width="2"/>
  <path d="M24 22h30q7 0 7 7v18q0 7-7 7H40l-12 9v-9h-4q-7 0-7-7V29q0-7 7-7z" fill="none" stroke="#e51b23" stroke-width="3"/>
  <circle cx="30" cy="38" r="2" fill="#e51b23"/><circle cx="39" cy="38" r="2" fill="#e51b23"/><circle cx="48" cy="38" r="2" fill="#e51b23"/>
  <text x="72" y="46" font-size="16" fill="#171717" font-weight="600">Messaging</text>
 </g>
</g>
<!-- subtle ground -->
<ellipse cx="1080" cy="790" rx="620" ry="35" fill="#aeb1b5" opacity=".18"/>
</svg>